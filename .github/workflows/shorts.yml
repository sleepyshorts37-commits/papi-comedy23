name: Papi Comedy - Production

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12,17,20 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts pillow

      - name: Generer une video illustree
        run: python generate.py

      - name: Sauvegarder la derniere video pour publication
        run: |
          mkdir -p public
          cp videos/*.mp4 public/latest.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/latest.mp4
          git commit -m "Generate latest Papi Comedy Short" || echo "No changes to commit"
          git push
